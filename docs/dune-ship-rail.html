<!doctype html><meta charset="utf-8"><title>Dune — the ship rail</title>
<body style="margin:0;padding:24px;background:#0b1220;color:#f0e2bb;font:14px Georgia,serif">
<h1 style="font-size:18px;margin:0 0 4px">The ship rail, state by state</h1>
<p style="opacity:.7;margin:0 0 18px;font-size:12px">The real component, rendered as each seat meets it — pool label, staged counts, and the fare as that seat pays it.</p>
<div style="display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap">

  </figure>

ces back" style="margin-top:4px">↺ back</button><span style="display:block;margin-top:8px;opacity:0.7;line-height:1.4">Fares: 1 spice per force into a stronghold, 2 anywhere else — paid to the Spacing Guild.</span></div></div>

  <figure style="margin:0;width:120px">

.7;line-height:1.4">Fremen ride the desert: any or all of your reserves, free, onto the Great Flat or any territory within two of it. Beyond that, full fare to the bank — 1 spice per force into a stronghold, 2 anywhere else.</span></div></div>
  </figure>
