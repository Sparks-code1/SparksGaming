<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- La, la, la. Three notes and nothing else — the card is a shrug, so the
       drawing is a shrug: a phrase that goes nowhere, drifting up and off. -->
  <g fill="#000000">
    <!-- three note heads, rising -->
    <ellipse cx="30" cy="86" rx="11" ry="8" transform="rotate(-20 30 86)" />
    <ellipse cx="60" cy="70" rx="11" ry="8" transform="rotate(-20 60 70)" />
    <ellipse cx="90" cy="52" rx="11" ry="8" transform="rotate(-20 90 52)" />
  </g>
  <g fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round">
    <!-- stems -->
    <path d="M40 82 L40 34" />
    <path d="M70 66 L70 22" />
    <path d="M100 48 L100 14" />
    <!-- a beam across the top, sagging, because the tune is not going anywhere -->
    <path d="M40 34 C60 26 80 18 100 14" stroke-width="6" />
  </g>
</svg>
