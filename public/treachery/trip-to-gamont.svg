<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Gamont: the pleasure planet, and a long way from here. A ringed world with
       a departure arc leaving it — the trip is the card, and the trip is the
       joke, because you are on Arrakis and you are not going. -->
  <g fill="none" stroke="#3f2c1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- the world -->
    <circle cx="66" cy="62" r="28" />
    <!-- its ring, tilted -->
    <ellipse cx="66" cy="62" rx="44" ry="13" transform="rotate(-22 66 62)" />
    <!-- the departure arc, curving away off the corner -->
    <path d="M24 100 C36 92 42 80 44 66" stroke-width="3" stroke-dasharray="7 7" opacity="0.85" />
  </g>
  <!-- a couple of bands across the world, so it reads as a planet and not a
       coin with a hoop round it -->
  <g fill="none" stroke="#3f2c1a" stroke-width="2.4" opacity="0.7">
    <path d="M42 50 C54 45 78 45 90 50" />
    <path d="M40 74 C54 80 78 80 92 74" />
  </g>
  <!-- the ship, small, already leaving -->
  <path d="M22 104 l9 -4 -3 8 z" fill="#3f2c1a" />
</svg>
